<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Real Hourly Rate Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
      <div id="auth">
    <input type="email" id="email" placeholder="email">
    <input type="password" id="password" placeholder="password">
    <button id="signupBtn">Sign up</button>
    <button id="loginBtn">Log in</button>
    <button id="logoutBtn">Log out</button>
    <span id="authStatus"></span>
  </div>

    <h1>Real Hourly Rate Calculator</h1>

    <label for="salary">Gross annual salary (€)</label>
    <input type="number" id="salary">

    <label for="hours">Contracted hours per week</label>
    <input type="number" id="hours">

    <label for="overtime">Unpaid overtime hours per week</label>
    <input type="number" id="overtime">

    <label for="commute">Commute minutes per day (round trip)</label>
    <input type="number" id="commute">

    <label for="leave">Paid leave days per year</label>
    <input type="number" id="leave">

    <button id="calcBtn">Calculate</button>

      <div id="result"></div>
  <div id="breakdown"></div>
  <div id="comparison"></div>



       <div id="historySection">
    <h2>Your history</h2>
    <ul id="history"></ul>
  </div>

  <div id="upgrade">
    <p>Save unlimited calculations and track your rate over time.</p>
    <button id="upgradeBtn">Upgrade to Pro — €5/month</button>

    <div id="waitlist" style="display: none;">
      <p>Not available yet. Leave your email and I'll tell you when it is.</p>
      <input type="email" id="waitlistEmail" placeholder="your@email.com">
      <button id="waitlistBtn">Notify me</button>
      <span id="waitlistStatus"></span>
    </div>
  </div>


    

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>
